; Polybar — Catppuccin Mocha
[colors]
base = #1e1e2e
mantle = #181825
crust = #11111b
surface0 = #313244
surface1 = #45475a
overlay0 = #6c7086
text = #cdd6f4
subtext0 = #a6adc8
mauve = #cba6f7
red = #f38ba8
peach = #fab387
yellow = #f9e2af
green = #a6e3a1
teal = #94e2d5
sky = #89dceb
blue = #89b4fa
lavender = #b4befe
pink = #f5c2e7

[bar/main]
width = 100%
height = 28
fixed-center = true
background = ${colors.mantle}
foreground = ${colors.text}
line-size = 2
border-bottom-size = 2
border-bottom-color = ${colors.surface0}
padding-left = 1
padding-right = 1
module-margin = 1
separator = "│"
separator-foreground = ${colors.surface1}

font-0 = "JetBrainsMono Nerd Font:style=Medium:size=10;3"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=10;3"
font-2 = "JetBrainsMono Nerd Font:size=13;3"

modules-left = arch i3 xwindow
modules-center = date
modules-right = cpu memory filesystem network pulseaudio tray powermenu

cursor-click = pointer
enable-ipc = true
override-redirect = false

[module/arch]
type = custom/text
format = ""
format-font = 3
format-foreground = ${colors.blue}
format-padding = 1
click-left = rofi -show drun &

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
enable-scroll = true
wrapping-scroll = false

label-mode = " %mode% "
label-mode-background = ${colors.peach}
label-mode-foreground = ${colors.crust}
label-mode-font = 2

label-focused = %name%
label-focused-background = ${colors.mauve}
label-focused-foreground = ${colors.crust}
label-focused-font = 2
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.subtext0}
label-unfocused-padding = 1

label-visible = %name%
label-visible-background = ${colors.surface0}
label-visible-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.crust}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
format-prefix = " "
format-prefix-foreground = ${colors.lavender}
label = %title:0:50:...%
label-empty = Desktop
label-empty-foreground = ${colors.overlay0}

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
date-alt = %A, %d %B %Y
time-alt = %H:%M:%S
format-prefix = " "
format-prefix-foreground = ${colors.mauve}
label = %date%  %time%
label-font = 2

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.red}
label = %percentage:2%%
warn-percentage = 85
format-warn-prefix = " "
format-warn-prefix-foreground = ${colors.red}
label-warn = %percentage:2%%
label-warn-foreground = ${colors.red}

[module/memory]
type = internal/memory
interval = 3
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.peach}
label = %used%

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
format-mounted-prefix = " "
format-mounted-prefix-foreground = ${colors.yellow}
label-mounted = %percentage_used%%
label-unmounted = %mountpoint% n/a
label-unmounted-foreground = ${colors.overlay0}

[module/network]
type = internal/network
interface-type = wired
interval = 3
format-connected-prefix = "󰈀 "
format-connected-prefix-foreground = ${colors.green}
label-connected = %local_ip%   %downspeed:6%
format-disconnected-prefix = "󰈁 "
format-disconnected-prefix-foreground = ${colors.red}
label-disconnected = offline
label-disconnected-foreground = ${colors.overlay0}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume> <label-volume>
ramp-volume-0 = ""
ramp-volume-1 = ""
ramp-volume-2 = ""
ramp-volume-foreground = ${colors.sky}
label-volume = %percentage%%
label-muted = "󰝟 muted"
label-muted-foreground = ${colors.overlay0}
click-right = pavucontrol &

[module/tray]
type = internal/tray
tray-size = 60%
tray-spacing = 6px
tray-background = ${colors.mantle}

[module/powermenu]
type = custom/text
format = ""
format-font = 3
format-foreground = ${colors.red}
format-padding = 1
click-left = ~/.config/rofi/powermenu.sh &

[settings]
screenchange-reload = true
