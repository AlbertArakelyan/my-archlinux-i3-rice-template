# picom — minimal, VirtualBox-safe. No effects, only tear-free rendering.
backend = "xrender";
vsync = true;
use-damage = true;
unredir-if-possible = false;
detect-client-opacity = false;

shadow = false;
fading = false;
blur-background = false;
corner-radius = 0;
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
